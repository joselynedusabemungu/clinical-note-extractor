services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      USE_MOCK: "${USE_MOCK:-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      MODEL: "${MODEL:-gpt-4o-mini}"

  web:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      - api

  evals:
    build: ./backend
    command: ["python", "evals/run_evals.py"]
    environment:
      USE_MOCK: "${USE_MOCK:-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      MODEL: "${MODEL:-gpt-4o-mini}"
    profiles: ["evals"]
