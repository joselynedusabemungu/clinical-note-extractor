name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydantic requests pytest fastapi python-dotenv openai httpx
      - run: USE_MOCK=1 pytest backend/tests/ -q
      - run: USE_MOCK=1 python backend/evals/run_evals.py